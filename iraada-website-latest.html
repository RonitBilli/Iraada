   The rent bug (a fix written into a function nobody called) proved that "the code runs" and "the
   lever moves the number" are different tests, and only the second catches that class of error.
   These are properties that must hold on EVERY change. Run selfTest() in the console. */
function selfTest(){
  const P={age:30,ret:60,life:85,lifePrimary:85,incMo:200000,sIncMo:0,incr:0.066,sIncr:0.064,bonus:0,sBon:0,
    sAge:30,sRet:60,expCats:[['Rent',50000,0.065],['Groceries',20000,0.055],['Misc',30000,0.055]],
    emiTotal:0,existingLoans:[],goals:[],legacy:0,legacyHouse:1,startEq:1000000,startDebt:500000,
    startCash:500000,pf0:500000,nps0:0,npsMo:0,mix:targetMix('Moderate'),insPrem:0,risk:'Moderate',
    healthCover:1000000,investRate:0.8,deps:[],overrides:{},cbreak:{who:'none',startsIn:0,yrs:0},
    annuityPct:0,annuityRate:0.065,annuityJoint:false};
  const corpus=o=>runProjection(Object.assign({},P,o)).accumulated;
  const T=[], ok=(n,c,d)=>T.push({test:n,pass:!!c,detail:d});

  // 1. rent at year 20 is exactly base × (1+r)^20 — the invariant the dead helper hid
  const r20=yearExpense({expCats:[['Rent',50000,0.065]]},20,false,0,false), exp20=50000*12*Math.pow(1.065,20);
  ok('rent compounds at its own visible rate', Math.abs(r20-exp20)<1, `${Math.round(r20)} vs ${Math.round(exp20)}`);
  // 2. rent stops when the house is owned
  ok('rent stops once the house is owned', yearExpense({expCats:[['Rent',50000,0.065]]},20,true,0,false)===0);
  // 3. more saving is never worse
  ok('corpus rises with savings discipline', corpus({investRate:0.9})>corpus({investRate:0.6}));
  // 4. working longer is never worse
  ok('corpus rises with a later retirement', corpus({ret:65})>corpus({ret:58}));
  // 5. a dependant never makes you richer in the year they exist
  const noDep=corpus({deps:[]}), planned=corpus({deps:[['Child',0,2,0]]});
  ok('a PLANNED child costs money', planned<noDep, `${Math.round(planned/1e7)}cr vs ${Math.round(noDep/1e7)}cr`);
  // 6. a career break costs money, and a longer one costs more
  const b0=corpus({}), b1=corpus({cbreak:{who:'me',startsIn:3,yrs:1}}), b3=corpus({cbreak:{who:'me',startsIn:3,yrs:3}});
  ok('a career break costs money', b1<b0); ok('a longer break costs more', b3<b1);
  // 7. an inheritance helps; an estate of 0 changes nothing
  ok('an estate increases the corpus', corpus({deps:[['Parent',63,0,5000000]]})>corpus({deps:[['Parent',63,0,0]]}));
  // 8. more risk = higher median but a worse downside (the whole point of the range)
  const mcA=monteCarlo(Object.assign({},P,{risk:'Very Aggressive',mix:targetMix('Very Aggressive')}),150);
  const mcC=monteCarlo(Object.assign({},P,{risk:'Very Conservative',mix:targetMix('Very Conservative')}),150);
  ok('aggressive has the higher median', mcA.p50>mcC.p50, `${Math.round(mcA.p50/1e7)}cr vs ${Math.round(mcC.p50/1e7)}cr`);
  // 9. transaction costs make a house cost more than its price
  const hg=[['Home','House',10000000,5]];
  ok('a house costs more than its sticker price', corpus({goals:hg})<corpus({goals:[]}));
  // 10. no NaN anywhere in a full projection
  const rows=runProjection(Object.assign({},P,{deps:[['Child',5,0,0],['Parent',63,0,2000000]],goals:hg})).proj;
  ok('no NaN in any projected year', rows.every(r=>[r.gross,r.exp,r.netWorth,r.surplus].every(v=>Number.isFinite(v))));
  // 11. the level annuity must lose real value — the claim the product is built on
  const withAnn=runProjection(Object.assign({},P,{annuityPct:0.4}));
  ok('annuity income is level (never rises)', withAnn.annuityIncome>0);
  // 12. tax is never negative and never exceeds income
  ok('tax is sane in every year', rows.every(r=>r.tax>=0 && r.tax<=Math.max(r.gross,1)));

  // 13. DETERMINISM: identical inputs must give an identical answer, every time
  const m1=monteCarlo(P,120).success, m2=monteCarlo(P,120).success;
  ok('same inputs give the same odds', m1===m2, `${(m1*100).toFixed(1)}% twice`);
  // 14. ...but different inputs must genuinely differ (not a frozen seed)
  ok('different inputs give different draws',

  const inflBefore=RET_ASSUME.infl; monteCarlo(P,30);

  console.log(`%cINVARIANTS: ${T.length-failed.length}/${T.length} passed`,`color:${failed.length?'#9E4332':'#1F6E54'};font-weight:700`);
  T.forEach(t=>console.log(`${t.pass?'✅':'❌'} ${t.test}${t.detail?' — '+t.detail:''}`));

/* PAYWALL — a placeholder gate, not a real one. No payment is taken and nothing is verified;
   `S.paid` is a local flag so the rest of the flow can be built and tested against it. When a real
   provider goes in, only unlockFull() should need to change. */
function unlockFull(toPlan){
  if(S.paid){ go(toPlan?'plan':'start'); return; }
  const m=document.createElement('div');
  m.id='paywall';
  m.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(10,20,22,.55);display:flex;align-items:center;justify-content:center;padding:20px';
  m.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;max-width:460px;width:100%;padding:28px">
    <div class="eyebrow">Full plan</div>
    <h2 style="font-family:var(--serif,Georgia),serif;font-size:26px;margin:6px 0 10px">Everything the preview left out</h2>
    <ul style="padding-left:18px;font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 18px">
      <li>Your real assets, loans and goals — not our defaults</li>
      <li>Dependants modelled properly: a child and a parent are opposite events</li>
      <li>Tax on every withdrawal, insurance gaps, the year-by-year ledger</li>
      <li>What to change first, ranked by how much it actually moves your odds</li>
    </ul>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:16px">
      <div style="font-family:var(--serif,Georgia),serif;font-size:32px">₹499</div>
      <div style="font-size:13px;color:var(--faint)">one-time · revisit and edit any time</div>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="pw_go">Continue to payment</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:8px" id="pw_x">Not now</button>
    <div style="font-size:11px;color:var(--faint);text-align:center;margin-top:12px">Placeholder — no payment is taken and no card details are collected.</div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#pw_x').onclick=()=>m.remove();
  m.querySelector('#pw_go').onclick=()=>{ S.paid=true; save&&save(); m.remove();
    toast('Unlocked — opening your full plan',2600);
    if(toPlan){ render(); } else { go('start'); } };
  m.onclick=e=>{ if(e.target===m) m.remove(); };
}
function mountPreview(){
  const $$$=id=>document.getElementById(id);
  const fmtR=v=>'₹'+Math.round(v).toLocaleString('en-IN');
  const cr=v=>v>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':v>=1e5?'₹'+(v/1e5).toFixed(1)+' L':fmtR(v);
  let timer=null;

  function paint(){
    $$$('pv_age_v').textContent=PV.age;
    $$$('pv_ret_v').textContent=PV.ret;
    $$$('pv_inc_v').textContent=fmtR(PV.inc);
    $$$('pv_sp_v').textContent=fmtR(PV.spend);
  }
  function run(){
    const s=pvState();
    let R;try{ R=ENGINE.calc(s,{runs:120}); }catch(e){ console.error(e); return; }
    const mc=R.mc, pj=R.proj;
    const odds=oddsPct(mc.success);
    const lastsTo = mc.medianRuin ? mc.medianRuin : s.life;
    const good = odds>=75, fragile = odds>=40&&!good;
    const savingsRate = R.annualInc>0 ? Math.max(0,(R.annualInc-R.annualExp)/R.annualInc) : 0;
    /* medianRuin is the median age among the runs that FAIL — not across all futures. Saying
       "in most futures your money runs out" alongside 73% odds would contradict itself. */
    const verdict = !mc.medianRuin
      ? (good ? `Your money comfortably outlives you.`
              : `Your money lasts — but the margin is thin.`)
      : good
        ? `This mostly holds. In the <em>${100-odds}%</em> of futures where it doesn't, the money goes around <em style="color:var(--red)">${mc.medianRuin}</em>.`
        : fragile
          ? `This works only if life cooperates. When it doesn't, the money runs out around <em style="color:var(--red)">${mc.medianRuin}</em>.`
          : `In most futures, your money runs out around <em style="color:var(--red)">${mc.medianRuin}</em>.`;
    const truths=[];
    truths.push(`In today's money, what you're on track for is worth <b>${cr(pj.realAtRet||0)}</b> — that is what it actually buys, stripped of inflation.`);
    truths.push(`You're saving <b>${Math.round(savingsRate*100)}%</b> of what comes in. ${savingsRate<0.15?'That is the single biggest thing holding this plan back.':savingsRate<0.3?'Respectable, and the clearest lever you control.':'Strong — that habit is doing most of the work here.'}`);
    if(mc.avgJobLoss>0) truths.push(`Across the simulated lives you hit <b>${mc.avgJobLoss.toFixed(1)}</b> job losses and <b>${mc.avgMed.toFixed(1)}</b> serious medical events. They're in the number above — we don't model a life where nothing goes wrong.`);

    $$$('pv_out').innerHTML=`
      <div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)">Your broad picture</div>
      <div class="pv-verdict">${verdict}</div>
      <div class="pv-odds">
        <div class="o"><div class="k">Chance it works</div><div class="v" style="color:${good?'var(--teal)':fragile?'var(--gold)':'var(--red)'}">${odds}%</div></div>
        <div class="o"><div class="k">You'll need by ${s.ret}</div><div class="v">${cr(pj.required)}</div></div>
        <div class="o"><div class="k">You're on track for</div><div class="v" style="color:${mc.p50>=pj.required?'var(--teal)':'var(--red)'}">${cr(mc.p50)}</div></div>
      </div>
      <div class="tag" style="margin:-4px 0 12px;color:${mc.p50>=pj.required?'var(--teal)':'var(--red)'}">
        ${mc.p50>=pj.required
          ? `That's <b>${cr(mc.p50-pj.required)} more</b> than you need — the gap is your margin for the things this can't see.`
          : `That's <b>${cr(pj.required-mc.p50)} short</b> of what this life costs. Poor markets would land you at ${cr(mc.p10)}.`}
      </div>
      <ul class="pv-truths" style="padding-left:18px;margin:0">${truths.map(t=>`<li>${t}</li>`).join('')}</ul>
      <div class="tag" style="margin-top:14px;color:var(--faint)">Based on ${mc.n} simulated lifetimes at a Moderate risk profile, assuming you own nothing and owe nothing yet. Your real assets, goals, dependants and cover will move this — usually a lot.</div>

      <div class="pv-lock">
        <div class="blur">
          <b>What to fix first</b>
          <div style="font-size:13px;margin-top:6px">Your life cover is short by ₹—— · your emergency fund covers —— months · shifting retirement by —— years changes the odds to ——%</div>
          <div style="font-size:13px;margin-top:8px"><b>Your real number</b> — the corpus you need in today's money, after tax, inflation and the years your parents need you.</div>
          <div style="font-size:13px;margin-top:8px"><b>Year by year</b> — every age from ${PV.age} to 90: income, spending, EMIs, what you can invest, and the year each goal lands.</div>
        </div>
        <div class="over">
          <div style="font-weight:700;font-size:15px">The full plan goes much further</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px;max-width:420px">Your actual assets and loans, your goals, your dependants, tax on every withdrawal, insurance gaps, and the one change that moves your odds most.</div>
        </div>
      </div>

      <div class="pv-cta">
        <a class="btn btn-primary btn-lg" href="#/start">Run this on my real numbers <span class="arrow">→</span></a>
        <span style="font-size:13px;color:var(--faint)">About 6 minutes · free · your odds at the end</span>
      </div>`;
  }
  function schedule(){ paint(); clearTimeout(timer); timer=setTimeout(run,140); }

  const a=$$$('pv_age'),r=$$$('pv_ret'),inc=$$$('pv_inc'),sp=$$$('pv_sp');
  a.oninput=()=>{PV.age=+a.value; if(PV.ret<=PV.age){PV.ret=PV.age+1;r.value=PV.ret;} schedule();};
  r.oninput=()=>{PV.ret=Math.max(+r.value,PV.age+1); r.value=PV.ret; schedule();};
  inc.oninput=()=>{PV.inc=+inc.value; schedule();};
  sp.oninput=()=>{PV.spend=+sp.value; schedule();};
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{PV.inc=+b.dataset.inc;inc.value=PV.inc;schedule();});
  document.querySelectorAll('[data-spf]').forEach(b=>b.onclick=()=>{PV.spend=Math.round(PV.inc*+b.dataset.spf/2500)*2500;sp.value=PV.spend;schedule();});
  paint(); run();
}

function mountQuiz(app){const steps=quizSteps();let i=clamp(S.quiz._i||0,0,steps.length-1);
  const box=el(`<section class="quiz"><div class="quiz-card"><div class="progress"><i id="qp"></i></div><div id="qs"></div>
    <div class="q-nav"><button class="btn btn-ghost" id="qback">← Back</button><span class="kbd">Press <kbd>Enter</kbd> to continue</span><button class="btn btn-primary" id="qnext">Continue <span class="arrow">→</span></button></div></div></section>`);
  app.appendChild(box);
  function show(){const st=steps[i];S.quiz._i=i;save();$('#qp').style.width=((i)/(steps.length))*100+'%';
    $('#qs').innerHTML=`<div class="q-anim"><div class="q-eyebrow">${st.eyebrow}</div><h1 class="q-title">${st.title}</h1>${st.help?`<p class="q-help">${st.help}</p>`:''}<div class="q-body">${st.body()}</div></div>`;
    $('#qback').style.visibility=i===0?'hidden':'visible';$('#qnext').innerHTML=i===steps.length-1?'Now, your numbers <span class="arrow">→</span>':'Continue <span class="arrow">→</span>';
    /* chip handling */
    $$('#qs .chip').forEach(c=>c.onclick=()=>{const k=c.dataset.k,v=c.dataset.v;
      if(st.pick){S[st.pick]=v;} else if(st.pickQuiz){S.quiz[st.pickQuiz]=+v;} else if(st.pickNum){S[st.pickNum]=+v;}
      else if(k==='hh'){S.quiz.hh=v;}
      $$('#qs .chip[data-k="'+(k||'')+'"]').forEach(x=>x.classList.remove('on'));if(!k)$$('#qs .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
      if(!st.multi&&(st.pick||st.pickQuiz||st.pickNum))setTimeout(next,220);});
    st.onmount&&st.onmount();const f=$('#qs input');f&&f.focus&&setTimeout(()=>f.focus(),60);}
  function next(){const st=steps[i];if(!st.ok()){toast('Pick or fill something to continue');const f=$('#qs .inp');f&&f.classList.add('err');return;}st.commit&&st.commit();save();
    if(i<steps.length-1){i++;show();}else{S.quiz._i=0;save();go('details');}}
  $('#qnext').onclick=next;$('#qback').onclick=()=>{if(i>0){i--;show();}};
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();next();}});
  show();}
</script>
<script>
/* =====================================================================
   DETAILS — structured inputs, pre-filled, compulsory vs optional

function numField(o){/* o:{path,label,req,opt,help,pre:'₹',suf,step,ph,pct,int,min,max,small} */
  const v=getPath(S,o.path);const shown=o.pct?(v!=null?+(v*100).toFixed(2):''):(o.int?(v==null?'':v):(v?Number(v).toLocaleString('en-IN'):''));
  return `<div class="field"><label>${o.label}${o.req?'<span class="req">*</span>':''}${o.opt?'<span class="opt">optional</span>':''}</label>
    <div class="inp-wrap">${o.pre?`<span class="pre">${o.pre}</span>`:''}<input class="inp num" data-path="${o.path}" ${o.pct?'data-pct="1"':''} ${o.int?'data-int="1"':''} inputmode="decimal" value="${shown}" placeholder="${o.ph||''}" ${o.min!=null?`data-min="${o.min}"`:''} ${o.max!=null?`data-max="${o.max}"`:''} style="${o.pre?'':'padding-left:13px'}">${o.suf?`<span class="suf">${o.suf}</span>`:''}</div>
    ${o.help?`<div class="help">${o.help}</div>`:''}${(o.pre==='₹')?`<div class="words" data-words="${o.path}">${words(v)}</div>`:''}</div>`;}
function textField(o){return `<div class="field"><label>${o.label}${o.req?'<span class="req">*</span>':''}${o.opt?'<span class="opt">optional</span>':''}</label><input class="inp" data-path="${o.path}" data-text="1" value="${esc(getPath(S,o.path))}" placeholder="${o.ph||''}">${o.help?`<div class="help">${o.help}</div>`:''}</div>`;}
function selectField(o){return `<div class="field"><label>${o.label}</label><select class="inp" data-path="${o.path}" data-text="1">${o.opts.map(x=>`<option value="${x[0]}" ${String(getPath(S,o.path))===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>${o.help?`<div class="help">${o.help}</div>`:''}</div>`;}
function bindInputs(root,onchange){root.querySelectorAll('[data-path]').forEach(e=>{if(e.dataset.bound)return;e.dataset.bound='1';const h=()=>{const p=e.dataset.path;let v;
    if(e.dataset.text){v=e.value;}else{v=parseNum(e.value);if(e.dataset.pct)v=v/100;if(e.dataset.min!=null)v=Math.max(+e.dataset.min,v);if(e.dataset.max!=null)v=Math.min(+e.dataset.max,v);if(e.dataset.int)v=Math.round(v);}
    setPath(S,p,v);const w=root.querySelector(`[data-words="${p}"]`);if(w)w.textContent=words(v);save();onchange&&onchange(p,v);};
    e.addEventListener('input',h);e.addEventListener('change',()=>{if(!e.dataset.text&&!e.dataset.pct&&!e.dataset.int){const v=getPath(S,e.dataset.path);e.value=v?Number(v).toLocaleString('en-IN'):'';}});});}
const rowIcon=`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
function tableMF(){return `<table class="tbl"><thead><tr><th style="width:44%">Fund name</th><th>Type</th><th>Current value</th><th>Past return</th><th></th></tr></thead><tbody>
  ${S.MF.map((m,i)=>`<tr><td><input class="inp" data-path="MF.${i}.name" data-text="1" value="${esc(m.name)}" placeholder="e.g. Nifty 50 index fund"></td>
   <td><select class="inp" data-path="MF.${i}.type" data-text="1"><option value="E" ${m.type==='E'?'selected':''}>Equity</option><option value="D" ${m.type==='D'?'selected':''}>Debt</option></select></td>
   <td><input class="inp num" data-path="MF.${i}.value" inputmode="numeric" value="${m.value?Number(m.value).toLocaleString('en-IN'):''}" placeholder="₹"></td>
   <td><input class="inp num" data-path="MF.${i}.ret" data-pct="1" inputmode="decimal" value="${m.ret?+(m.ret*100).toFixed(2):''}" placeholder="% p.a."></td>
   <td><button class="x" data-rm="MF" data-i="${i}" title="Remove">${rowIcon}</button></td></tr>`).join('')}</tbody></table>
  ${S.MF.length?'':'<div class="empty">No mutual funds yet — add one, or skip if you don\'t hold any.</div>'}<button class="add" data-add="MF">+ Add a fund</button>`;}
function tableFI(){return `<table class="tbl"><thead><tr><th style="width:50%">Deposit / bond / PPF</th><th>Current value</th><th>Rate</th><th></th></tr></thead><tbody>
  ${S.FI.map((m,i)=>`<tr><td><input class="inp" data-path="FI.${i}.name" data-text="1" value="${esc(m.name)}" placeholder="e.g. SBI FD, PPF"></td>
   <td><input class="inp num" data-path="FI.${i}.value" inputmode="numeric" value="${m.value?Number(m.value).toLocaleString('en-IN'):''}" placeholder="₹"></td>
   <td><input class="inp num" data-path="FI.${i}.rate" data-pct="1" inputmode="decimal" value="${m.rate?+(m.rate*100).toFixed(2):''}" placeholder="% p.a."></td>
   <td><button class="x" data-rm="FI" data-i="${i}">${rowIcon}</button></td></tr>`).join('')}</tbody></table>
  ${S.FI.length?'':'<div class="empty">No deposits yet — FDs, RDs, PPF, bonds go here.</div>'}<button class="add" data-add="FI">+ Add fixed income</button>`;}
function tableAssets(){return `<table class="tbl"><thead><tr><th style="width:40%">Type</th><th>Today's value</th><th></th></tr></thead><tbody>

function tableLoans(){return `<table class="tbl"><thead><tr><th style="width:34%">Loan type</th><th>Outstanding</th><th>EMI / month</th><th></th></tr></thead><tbody>
  ${S.LOANS.map((m,i)=>`<tr><td><select class="inp" data-path="LOANS.${i}.type" data-text="1">${['Home','Car','Education','Personal','Credit card'].map(t=>`<option ${m.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
   <td><input class="inp num" data-path="LOANS.${i}.amount" inputmode="numeric" value="${m.amount?Number(m.amount).toLocaleString('en-IN'):''}" placeholder="₹"></td>

function detailsChecks(){const c=[];const n=x=>+x||0;
  c.push({id:'you',ok:n(S.age)>=16&&n(S.ret)>n(S.age)&&n(S.life)>n(S.ret),msg:'Age, retirement age and life expectancy must go up in order.'});
  c.push({id:'income',ok:n(S.inc)>0||n(S.sp.inc)>0||n(S.rental)>0||S.stage==='retired',msg:'Enter at least one income.'});
  c.push({id:'spend',ok:S.EXP.some(e=>n(e.amt)>0),msg:'Enter your monthly spending.'});
  c.push({id:'own',ok:true});c.push({id:'owe',ok:true});c.push({id:'goals',ok:true});c.push({id:'protect',ok:true});c.push({id:'habits',ok:true});
  return c;}
/* Which sections are genuinely required, and what each optional one BUYS you. Presenting eight
   dense sections as equals is what made this page feel raw: three of them are the plan, five are
   refinements, and the page never said so. */
const DSEC_META={
  you:    {req:1},
  income: {req:1},
  spend:  {req:1},
  own:    {why:'Your assets change the corpus and let goals be part-funded by selling instead of borrowing.'},
  owe:    {why:'Loans eat surplus for years. Without them the plan looks better than your bank statement does.'},
  goals:  {why:'A house, a wedding, a degree — each inflates at its own rate and reshapes the years around it.'},
  protect:{why:'We size the cover you need against what you already hold, and show the gap.'},
  habits: {why:'Savings discipline, legacy, career break, NPS and annuity choices. Small inputs, big swings.'}
};
/* Collapse the optional sections behind a one-line reason, and auto-open any the user has filled.
   Inputs stay in the DOM (just hidden) so existing binding and validation are untouched. */
function collapseOptionalSections(main){
  const filled={
    own:    ()=>((S.MF||[]).length||(S.FI||[]).length||(S.ASSETS||[]).length||+S.cash>0||+S.pf>0),
    owe:    ()=>(S.LOANS||[]).length>0,
    goals:  ()=>(S.GOALS||[]).length>0,
    protect:()=>(+S.lifecover>0||+S.healthcover>0||+S.cicover>0),
    habits: ()=>(+S.legacy>0||+S.nps>0||(S.cbreak&&S.cbreak.who&&S.cbreak.who!=='none'))
  };
  Object.keys(filled).forEach(id=>{
    const sec=main.querySelector('#s-'+id); if(!sec||sec.dataset.collapsed) return;
    sec.dataset.collapsed='1';
    const h2=sec.querySelector('h2'); const title=h2?h2.textContent:id;
    const body=document.createElement('div');
    while(sec.firstChild) body.appendChild(sec.firstChild);
    const open=!!filled[id]();
    const head=document.createElement('button');
    head.type='button'; head.className='dsec-head'+(open?' open':'');
    head.innerHTML=`<span class="dsec-chev">›</span>
      <span class="dsec-t"><b>${title}</b><small>${(DSEC_META[id]||{}).why||''}</small></span>
      <span class="dsec-tag">${open?'Added':'Optional'}</span>`;
    body.className='dsec-body'; body.hidden=!open;
    sec.appendChild(head); sec.appendChild(body);
    head.onclick=()=>{ body.hidden=!body.hidden; head.classList.toggle('open',!body.hidden);
      head.querySelector('.dsec-tag').textContent=body.hidden?(filled[id]()?'Added':'Optional'):'Open'; };
  });
}
function mountDetails(app){if(!S.quizDone&&!S.inc){/* came here directly */}
  const secs=[['you','You & household'],['income','Money in'],['spend','Money out'],['own','What you own'],['owe','What you owe'],['goals','Goals'],['protect','Protection'],['habits','Habits, legacy & risk']];

  app.appendChild(page);
  const req=(t)=>`<span class="req">*</span>`;
  const main=$('#dmain');
  main.innerHTML=`
  <div class="dhead">
    <h1>Three things we need. Everything else is optional.</h1>

    <div class="dbar"><i id="dprog" style="width:0%"></i></div>
  </div>
  <section class="dsec" id="s-you"><h2>You & your household</h2><p class="lead">The spine of the plan. Fields marked <span style="color:var(--red);font-weight:800">*</span> are needed; the rest sharpen the answer.</p>
    <div class="grid3">${textField({path:'name',label:'Your name',req:1,ph:'First name'})}${numField({path:'age',label:'Age',req:1,int:1,min:16,max:95})}${textField({path:'city',label:'City',opt:1,ph:'e.g. Pune'})}</div>
    <div class="grid3" style="margin-top:14px">${numField({path:'ret',label:'Retire at',req:1,int:1,min:20,max:85,help:'The last year with a salary'})}${numField({path:'life',label:'Plan money to last until',req:1,int:1,min:40,max:105,help:'Not a prediction — a safety margin'})}${numField({path:'incr',label:'Salary growth / yr',pct:1,suf:'%',help:'India\'s average white-collar hike is 6–9%'})}</div>
    <div class="grid2" style="margin-top:14px">${textField({path:'occ',label:'Occupation',opt:1,ph:'e.g. Software engineer'})}</div>
    <h5 style="margin-top:22px">Who depends on you</h5>
    <p class="lead" style="margin-top:0">Not a headcount — a child and a parent are opposite financial events. A child costs for about eighteen years and then becomes independent; a parent's cost <b>rises</b> with age and ends in a bill. So we ask who and how old. You don't need to split out what they cost — that's already inside your monthly spending, and nobody really knows the number.</p>

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${['Child','Parent','Other'].map(r=>`<button type="button" onclick="addDepRow('${r}')" style="font-weight:700;font-size:13px;border:1px dashed var(--border2);background:transparent;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer">+ ${r}</button>`).join('')}
      <button type="button" onclick="addFutureChild()" title="A child you're planning — not here yet, so their cost is ADDED when they arrive, plus the birth" style="font-weight:700;font-size:13px;border:1px dashed var(--border2);background:transparent;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer">+ A child we're planning</button>
    </div>
    <button class="opt-toggle ${S.sp.has?'open':''}" data-toggle="spouse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg> Partner / spouse who earns or is covered by this plan</button>
    <div class="opt-body ${S.sp.has?'open':''}" id="spouse">
      <div class="grid3">${numField({path:'sp.age',label:'Partner\'s age',int:1,min:0,max:95})}${numField({path:'sp.ret',label:'Partner retires at',int:1,min:0,max:90})}${numField({path:'sp.life',label:'Partner\'s money lasts until',int:1,min:0,max:105})}</div>
      <div class="grid3" style="margin-top:14px">${numField({path:'sp.inc',label:'Partner\'s take-home / month',pre:'₹',ph:'0'})}${numField({path:'sp.bon',label:'Partner\'s bonus / year',pre:'₹',ph:'0'})}${numField({path:'sp.lifecover',label:'Partner\'s existing life cover',pre:'₹',ph:'0'})}</div>
      <div class="help" style="margin-top:8px">Leave income 0 if your partner doesn\'t earn — they still count for the plan.</div>
    </div>
  </section>
  <section class="dsec" id="s-income"><h2>Money in</h2><p class="lead">What comes in, and what\'s already sitting there. Take-home (after TDS) is what we want.</p>
    <div class="grid2">${numField({path:'inc',label:'Your take-home / month',req:1,pre:'₹',ph:'75,000'})}${numField({path:'bon',label:'Bonus / variable pay per year',opt:1,pre:'₹',ph:'0'})}</div>

  </section>
  <section class="dsec" id="s-spend"><h2>Money out</h2><p class="lead">Split from your gut number of <b class="mono">${inr(S.spendMo)}</b>. Correct any line — each grows at its own inflation rate over the years, medical fastest of all.</p>

    <div class="opt-body" id="expadv"><div class="tip">Rent follows a 5%/5%/10% three-year cycle (typical Indian lease). Everything else compounds at the rate you set. Rent stops the year you buy a home; 0.6% of the home\'s value replaces it as upkeep.</div></div>
  </section>
  <section class="dsec" id="s-own"><h2>What you own <span class="pill" style="vertical-align:middle">optional</span></h2><p class="lead">Existing investments become your starting equity / debt / cash mix; property, land, gold and vehicles enter the net-worth statement. If you have nothing yet, that\'s a fine place to start from.</p>

  </section>
  <section class="dsec" id="s-habits"><h2>Habits, legacy & risk</h2><p class="lead">The three inputs that quietly decide more than any return assumption.</p>
    <div class="grid3">${numField({path:'disc',label:'Surplus that actually gets invested',pct:0,int:1,min:0,max:100,suf:'%',help:'Set 100 to see the fantasy version'})}${numField({path:'legacy',label:'Leave behind for family (today\'s ₹)',pre:'₹',ph:'0',help:'Protected, not spent'})}${selectField({path:'legacyHouse',label:'Count the home towards it?',opts:[[1,'Yes — the home passes on'],[0,'No — cash & investments only']]})}</div>

    <h5 style="margin-top:26px">Career break</h5>
    <p class="lead" style="margin-top:0">The most predictable interruption there is — a child, or caring for a parent. Income stops, then comes back <b>permanently lower</b>: Indian research puts the re-entry penalty at ~10% for a short break and ~17% for a longer one.</p>

    <div class="grid3">${numField({path:'nps',label:'NPS balance today',pre:'₹',ph:'0'})}${numField({path:'npsMo',label:'NPS contribution / month',pre:'₹',ph:'0'})}${numField({path:'annPct',label:'Extra % of corpus annuitised',int:1,min:0,max:100,suf:'%',ph:'0'})}</div>
    <div class="grid3" style="margin-top:10px">${numField({path:'annRate',label:'Annuity rate',suf:'%',ph:'6.5',help:'5.5–7.5% in 2025'})}${selectField({path:'annJoint',label:'Annuity type',opts:[[0,'Single life'],[1,'Joint life — protects partner']]})}${numField({path:'childIndep',label:'A child stops depending at age',int:1,min:16,max:35,ph:'24',help:'PLFS: work is near-universal after 25'})}</div>

    <h5 style="margin-top:26px">Stress test: what if you go first?</h5>

    <div class="grid3">${numField({path:'lifePrimary',label:'You pass at age',int:1,min:0,max:110,ph:'0',help:'0 = same as plan end'})}</div>
  </section>`;
  const side=$('#dside');
  function riskTip(){const t=ENGINE.targetMix(S.risk);const sv=ENGINE.sleeveStats(S.risk,ENGINE.DEFAULT_ASSUME);$('#riskTip').innerHTML=`${S.riskScore!=null?`Your quiz read: <b>${ENGINE.riskFromScore(S.riskScore,S.riskMax)}</b> (${S.riskScore}/${S.riskMax}). `:''}<b>${S.risk}</b> targets ${pct(t.eq,0)} equity · ${pct(t.debt,0)} debt · ${pct(t.cash,0)} cash, with an equity sleeve expected to return ~${pct(sv.ret,1)} a year (±${pct(sv.vol,0)} swings). Risk is glided down automatically in the 15 years before retirement.`;}
  function sideUpdate(){const n=x=>+x||0;const inc=n(S.inc)*12+n(S.sp.inc)*12+n(S.bon)+n(S.sp.bon)+n(S.rental)*12;const exp=S.EXP.reduce((s,e)=>s+n(e.amt),0)*12;const emi=S.LOANS.reduce((s,l)=>s+n(l.emi),0)*12;const sav=inc-exp-emi;
    $('#expTot').textContent=inr(exp/12)+' / mo';
    const checks=detailsChecks();const bad=checks.filter(c=>!c.ok);

      (S.GOALS||[]).length>0,+S.healthcover>0||+S.lifecover>0,
      +S.legacy>0||+S.nps>0||(S.cbreak&&S.cbreak.who&&S.cbreak.who!=='none')].filter(Boolean).length;
    const prog=Math.round((reqDone/3)*70 + (optAdded/5)*30);

    checks.forEach(c=>{const a=$(`#dnav a[data-sec="${c.id}"]`);a.classList.toggle('ok',c.ok);a.classList.toggle('warn',!c.ok);});
    $('#buildBtn').disabled=bad.length>0;$('#buildTip').textContent=bad.length?bad[0].msg:'Everything needed is in. Optional sections make it sharper.';
    side.innerHTML=`<div class="card"><h6>Live household picture</h6>
      <div class="kv"><span>Income / year</span><b>${fmt(inc)}</b></div><div class="kv"><span>Spending / year</span><b>${fmt(exp)}</b></div>${emi?`<div class="kv"><span>EMIs / year</span><b>${fmt(emi)}</b></div>`:''}
      <div class="kv"><span>Left to invest / year</span><b class="${sav>=0?'good':'bad'}">${fmt(sav)}</b></div>
      <div class="kv"><span>Savings rate</span><b class="${sav/inc>=0.2?'good':sav>0?'':'bad'}">${inc?pct(sav/inc,0):'—'}</b></div>
      <div class="kv"><span>Goals</span><b>${S.GOALS.length} · ${fmt(S.GOALS.reduce((s,g)=>s+n(g.cost),0))} today</b></div></div>
      <div class="card"><h6>Why we ask</h6><p class="tip" style="margin-top:8px">${sav<0?'<b>You\'re spending more than you earn.</b> That\'s okay to enter honestly — the plan will show what it costs and where a fix helps most.':inc&&sav/inc<0.15?'A savings rate under 15% makes almost any long goal hard. The plan will show which lever moves it most.':'A healthy surplus. The question the plan answers is whether it\'s <b>enough</b>, invested <b>where</b>, and <b>protected</b> against what could go wrong.'}</p></div>
      <div class="card"><h6>Privacy</h6><p class="tip" style="margin-top:8px">Everything you type stays in this browser tab\'s storage. Nothing is sent anywhere. Clear it any time from the plan page.</p></div>`;}
  function rebind(){bindInputs(main,(p)=>{sideUpdate();if(p==='age'||p==='ret'||p==='life')refreshOrder();});
    main.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S[b.dataset.rm].splice(+b.dataset.i,1);save();rerenderTables();});

    main.querySelectorAll('[data-qg]').forEach(b=>b.onclick=()=>{const g=JSON.parse(b.dataset.qg);S.GOALS.push({name:g[0],type:g[1],cost:g[2],yrs:g[3]});save();rerenderTables();});
    main.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const t=$('#'+b.dataset.toggle);const open=!t.classList.contains('open');t.classList.toggle('open',open);b.classList.toggle('open',open);if(b.dataset.toggle==='spouse'){S.sp.has=open;if(open&&!S.sp.age){S.sp.age=S.age;main.querySelector('[data-path="sp.age"]').value=S.age;}save();}
      if(b.dataset.toggle==='expadv'){$('#expwrap').innerHTML=tableExp(open);rebind();sideUpdate();}});
    main.querySelectorAll('[data-risk]').forEach(b=>b.onclick=()=>{S.risk=b.dataset.risk;main.querySelectorAll('[data-risk]').forEach(x=>x.classList.toggle('on',x.dataset.risk===S.risk));save();riskTip();});}
  function rerenderTables(){$('#mfwrap').innerHTML=tableMF();$('#fiwrap').innerHTML=tableFI();$('#aswrap').innerHTML=tableAssets();$('#lnwrap').innerHTML=tableLoans();$('#glwrap').innerHTML=tableGoals();$('#expwrap').innerHTML=tableExp($('#expadv').classList.contains('open'));rebind();sideUpdate();}
  function refreshOrder(){const n=x=>+x||0;if(n(S.ret)<=n(S.age))S.ret=n(S.age)+1;if(n(S.life)<=n(S.ret))S.life=n(S.ret)+5;}

  rebind();riskTip();sideUpdate();renderDepEditor();

  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){$$('#dnav a').forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.id.replace('s-','')));}});},{rootMargin:'-30% 0px -60% 0px'});
  main.querySelectorAll('.dsec').forEach(s=>obs.observe(s));
  $$('#dnav a').forEach(a=>a.onclick=e=>{e.preventDefault();$(a.getAttribute('href')).scrollIntoView({behavior:'smooth'});});
  $('#buildBtn').onclick=()=>{refreshOrder();save();go('compute');};}
</script>
<script>
/* =====================================================================
   COMPUTE — the engine animation
   ===================================================================== */
function mountCompute(app){const tasks=['Reading your household','Building the net-worth statement','Ring-fencing 6 months as emergency fund','Inflating each goal at its own rate','Sizing life, health & critical-illness cover','Setting your equity / debt / cash mix','Applying FY 2025-26 tax on every withdrawal','Running 500 lifetimes with random markets','Adding job losses, hospital bills, paused SIPs','Reading the odds and writing your plan'];

/* ── THE ACTION PLAN ─────────────────────────────────────────────────────────────────────────
   Everything else in this product tells you WHAT WILL HAPPEN. This tells you WHAT TO DO — starting
   with the money already sitting in your accounts today, then the flow of every year after.
   Ordered the way it should actually be executed, not the way it's easy to compute. */
function tabAction(){
  const R=RESULT,pj=R.proj,rows=pj.proj,n=x=>+x||0;   // NOTE: `t` is computed below, age-aware
  const y0=rows[0];
  const ef=Math.round(y0.exp/2);                        // six months of spending
  const efHave=Math.min(n(S.cash),ef), efGap=Math.max(0,ef-efHave);
  const investable=Math.max(0,R.eqVal+R.debtInvVal+Math.max(0,n(S.cash)-ef));
  /* BUG FIXED: the action plan used the raw risk-profile mix at every age, so a 63-year-old retiree
     was told to move ₹57 LAKH *into* equity (34% → 60%), and a 55-year-old five years out was told
     to add ₹13L. The engine glides equity DOWN near retirement and holds a 35/55/10 mix after it —
     the advice must match what the engine actually does, or we're telling people to do the opposite
     of the plan we just sold them. */
  const retired=n(S.age)>=n(S.ret);
  const t=retired ? ENGINE.RET_ASSUME.retireMix
                  : ENGINE.glideMix(ENGINE.targetMix(S.risk), n(S.age), n(S.ret));
  const gm=t;
  const mixNote=retired
    ? 'You are drawing on this money now, so the target is the retirement mix — enough growth to outlast inflation, enough safety to survive a bad year without selling into it.'
    : (n(S.ret)-n(S.age)<=15
       ? `You are ${n(S.ret)-n(S.age)} years from retiring, so equity is already being glided down from the ${pct(ENGINE.targetMix(S.risk).eq,0)} a ${esc(S.risk)} profile would hold further out. The years just before you stop are the dangerous ones.`
       : '');
  const tgt={eq:t.eq*investable,debt:t.debt*investable,cash:t.cash*investable};
  const move=(cur,want)=>Math.round(want-cur);
  const dEq=move(R.eqVal,tgt.eq), dDebt=move(R.debtInvVal,tgt.debt);
  const costly=(S.LOANS||[]).map(l=>({...l,r:(ENGINE.LOAN_CFG[({Home:'home',Car:'car',Education:'education',Personal:'personal','Credit card':'personal'})[l.type]||'personal']||{}).r}))
    .filter(l=>n(l.amount)>0).sort((a,b)=>b.r-a.r);
  /* Year 1 usually under-states the SIP because the emergency fund is being filled first. Quote the
     first year where investing has settled, and say so, rather than handing over a number that looks
     absurdly small next to their income. */
  /* Pick the first year where most of the surplus actually reaches investments. Testing the EF
     BALANCE doesn't work — it's recorded after the top-up, so year 0 looks funded even though it
     swallowed the whole surplus (₹4.7L surplus, ₹8k invested). The ratio is the honest signal. */
  const settled=rows.find(r=>r.working&&r.invested>0&&r.surplus>0&&r.invested>=r.surplus*0.5)
              ||rows.find(r=>r.working&&r.invested>0)||y0;
  const sipMo=Math.round((settled.invested||0)/12), sipYr1=Math.round((y0.invested||0)/12);
  const sipRamps=sipMo>sipYr1*1.15 && settled.age>y0.age;

  /* ---- NOW: the opening moves, in the order they should be done ---- */
  const now=[];
  if(efGap>0) now.push(['Build the buffer first',
    `Hold <b>${fmt(ef)}</b> — six months of spending — in a liquid fund or sweep FD. You have ${fmt(efHave)} in cash, so move <b>${fmt(efGap)}</b> in before anything else.`,
    'Nothing else survives a bad month without this. It is not an investment; it is what stops you selling investments at the worst time.']);
  else now.push(['Buffer is done',
    `Your ${fmt(ef)} emergency fund is covered by the cash you already hold. Ring-fence it and leave it alone.`,
    'Keep it boring and liquid — this money has one job.']);
  if(costly.length && costly[0].r>=0.12) now.push(['Kill the expensive debt next',
    `Your ${esc(costly[0].type)} loan of <b>${fmt(n(costly[0].amount))}</b> costs about ${pct(costly[0].r,1)} a year. Clear it before adding to investments.`,
    `Paying off ${pct(costly[0].r,1)} debt is a guaranteed ${pct(costly[0].r,1)} return. No fund can promise that.`]);
  if(R.ins.deficit>0&&(S.deps.length>0||S.sp.has)) now.push([R.ins.floorBinding?'Buy a transition buffer':'Buy the cover you are short',
    `A term plan of <b>${fmt(R.ins.deficit)}</b> — roughly <b>${inr(R.ins.premium)}/yr</b>. ${R.ins.healthGap>0?`Also top health cover up to <b>${fmt(R.ins.healthReq)}</b>.`:''}`,
    R.ins.floorBinding
      ? 'On paper your household could cover its own costs without your income — so this is not income replacement, it is two years of breathing room. Grief, caregiving and a forced career change all break the assumption that the survivor simply carries on earning.'
      : 'Cheapest fix on this page, and the only one that protects everyone else on it.']);
  if(Math.abs(dEq)>10000||Math.abs(dDebt)>10000) now.push(['Move what you already hold into the right mix',
    `${retired?'Your target now is the <b>retirement mix</b>':(n(S.ret)-n(S.age)<=15?`Your <b>${esc(S.risk)}</b> profile, glided down for being ${n(S.ret)-n(S.age)} years out, targets`:`Target for a <b>${esc(S.risk)}</b> profile is`)} ${pct(t.eq,0)} equity · ${pct(t.debt,0)} debt · ${pct(t.cash,0)} cash. On your ${fmt(investable)} that means
     ${dEq>=0?`add <b>${fmt(dEq)}</b> to`:`take <b>${fmt(-dEq)}</b> out of`} equity and
     ${dDebt>=0?`add <b>${fmt(dDebt)}</b> to`:`take <b>${fmt(-dDebt)}</b> out of`} debt.`,
    (mixNote?mixNote+' ':'')+'Do it gradually if it triggers capital gains — the mix matters more than the timing.']);
  /* Only quote a step-up that is actually near. An earlier version told a household investing ₹0 today
     that they'd be putting in ₹97,973/month — a nominal figure two decades out, after salary growth.
     True, and useless. If nothing can be invested for years, say that instead. */
  const soon=settled.age-n(S.age)<=3;
  if(!retired && sipMo>0 && (soon||sipYr1>0)) now.push(['Start the monthly flow',
    `<b>${inr(soon?sipMo:sipYr1)}/month</b>, split ${pct(gm.eq,0)} / ${pct(gm.debt,0)} / ${pct(gm.cash,0)} across equity, debt and cash.`
    + (sipRamps&&soon?` This year it is only ${inr(sipYr1)}/month while the emergency fund fills — it steps up to ${inr(sipMo)} by ${settled.age}.`:''),
    'Automate it for the day after salary lands. Indian SIP data says intent is not the problem — timing is.']);
  else if(!retired && sipYr1<=0) now.push(['There is nothing left to invest yet',
    `After tax, spending and EMIs, this year leaves nothing to put away. On the current numbers that does not change until ${settled.age>n(S.age)?'age '+settled.age:'something changes'}.`,
    'Investing advice is beside the point until the gap closes. Cut spending or raise income first — the year-by-year table below shows exactly when it turns.']);

  /* A retiree's most important question isn't where to invest — it's how much they can take out,
     from which bucket, in what order. The plan said nothing about it. */
  if(retired){
    const y1=rows.find(r=>!r.working)||y0;
    const pot=R.eqVal+R.debtInvVal+n(S.cash);
    const rate=pot>0?(y1.exp/pot):0;
    now.push(['What you can safely draw',
      `Your spending is <b>${fmt(y1.exp)}</b> a year against a <b>${fmt(pot)}</b> corpus — a <b>${(rate*100).toFixed(1)}%</b> withdrawal rate.`,
      rate>0.045 ? 'That is above what an Indian portfolio can sustain for a long retirement. Inflation here runs close to safe returns, so the 4% rule travels badly — trimming spending or adding a guaranteed pension does more than any fund choice.'
                 : 'That is within the range a mixed portfolio can usually sustain, but it is not a promise — the Retirement tab shows how often it holds.']);
    now.push(['Take money in the right order',
      'Draw from cash first, then debt, then equity. Keep at least two years of spending in cash and short debt so a bad market never forces you to sell equity.',
      'This ordering is what the plan already assumes when it taxes your withdrawals — following it is what makes the projection true.']);
  }
  /* ---- THEN: what each year asks of you ---- */
  const yearRows=rows.filter(r=>r.age<=S.life).map((r,i)=>{
    const acts=[];
    (r.goals||[]).forEach(g=>acts.push(`<b>${esc(g.name)}</b> — ${esc(g.action||'')}`));
    if(r.working&&r.invested>0) acts.push(`Invest ${inr(Math.round(r.invested/12))}/mo`);
    if(!r.working&&r.surplus<0) acts.push(`Draw ${inr(Math.round(-r.surplus/12))}/mo from the corpus`);
    if(r.age===S.ret) acts.push('<b>Retire</b> — PF released, gratuity paid, shift to the retirement mix');
    if(r.age===S.ret-5) acts.push('Start gliding equity down — the five years before you stop are the risky ones');
    if(r.emi>0&&i>0&&rows[i-1].emi===0) acts.push('EMI begins');
    if(r.emi===0&&i>0&&rows[i-1].emi>0) acts.push('EMI ends — redirect it into investments');
    if(r.surplus<0&&r.working) acts.push('<span style="color:var(--red)">Short this year — borrowing to cover spending</span>');
    return {age:r.age,year:r.year,working:r.working,
      inflow:r.working?r.gross:0, out:r.exp+r.emi, invest:r.invested,
      worth:r.netWorth, acts};
  });

  return `<div class="card"><h3>What to do with the money you have now</h3>
    ${help('This is the opening sequence, in order. Each step assumes the one above it is done — that ordering is the advice, not just the list.')}
    <ol style="padding-left:20px;margin:14px 0 0">
      ${now.map(a=>`<li style="margin-bottom:16px">
        <div style="font-family:var(--serif,Georgia),serif;font-size:18px">${a[0]}</div>
        <div style="font-size:14px;line-height:1.65;margin-top:3px">${a[1]}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">${a[2]}</div></li>`).join('')}
    </ol></div>

  <div class="card"><h3>Then, every year after</h3>
    ${help('Your money in, your money out, what to invest, and what happens that year. This is the same projection behind your odds — read as instructions instead of a forecast.')}
    <div style="max-height:560px;overflow:auto;margin-top:12px">
    <table class="gtbl"><thead><tr><th>Age</th><th>Year</th><th>Money in</th><th>Out</th><th>Invest</th><th>Net worth</th><th>What to do</th></tr></thead>
    <tbody>${yearRows.map(r=>`<tr${r.age===S.ret?' style="background:var(--surface2)"':''}>
      <td><b>${r.age}</b></td><td style="color:var(--faint);font-size:11px">${r.year}</td>
      <td>${r.inflow?fmt(r.inflow):'—'}</td><td>${fmt(r.out)}</td>
      <td>${r.invest>0?fmt(r.invest):'—'}</td><td><b>${fmt(r.worth)}</b></td>
      <td style="font-size:12px">${r.acts.join(' · ')||'Stay the course'}</td></tr>`).join('')}</tbody></table></div>
    <div class="callout" style="margin-top:14px">These are nominal rupees — the later numbers look large because of inflation, not because you get rich. The Retirement tab shows what they buy in today's money.</div>
  </div>`;
}
function verdict(R){const s=R.mc.success;const good=s>=0.75,frag=s>=0.4&&!good;
  const head=good?`This plan holds up in most futures.`:frag?`This plan is fragile — it works only if markets and life cooperate.`:`As it stands, this plan doesn't hold up.`;
  const sub=good?`Out of ${R.mc.n} simulated lifetimes, your money lasted to ${S.life}${S.legacy?' with your legacy intact':''} in ${oddsPct(s)}%. The fixes below turn a good plan into a robust one.`:frag?`It survives ${oddsPct(s)}% of the ${R.mc.n} lifetimes we ran. That's a coin toss with your retirement. The good news: the levers below move it a lot.`:`It survives ${oddsPct(s)}% of ${R.mc.n} lifetimes. The goals are bigger than the income, savings and cover behind them — something has to change, and the list below is where to start.`;
  return {head,sub,good,frag};}
function fixes(R){const f=[];const n=x=>+x||0;const inc=R.annualInc||1;const sr=R.savings/inc;
  if(R.savings<0)f.push(['red','!',`You spend ${fmt(-R.savings)} more than you earn each year. Nothing else works until this flips.`]);
  else if(sr<0.2)f.push(['gold','%',`Savings rate is ${pct(sr,0)}. Every 5-point rise moves your odds more than any fund choice. Trim the biggest line in "Money out".`]);
  if(R.ins.deficit>0&&n(S.inc)>0&&(S.deps.length>0||S.sp.has))f.push(['red','⚑',`Life cover gap of ${fmt(R.ins.deficit)}. A term plan of that size costs roughly ${inr(R.ins.premium)}/yr — the cheapest fix on this page.`]);
  if(R.ins.healthGap>0)f.push(['gold','+',`Health cover is ${fmt(R.ins.healthGap)} short of the ${fmt(R.ins.healthReq)} the model wants for your income. One hospitalisation can undo years of SIPs.`]);
  if(S.disc<80)f.push(['gold','↻',`Only ${S.disc}% of your surplus gets invested. Automating a SIP on salary day is worth more than picking a better fund.`]);
  const borrowed=R.proj.proj.flatMap(r=>r.goals).filter(g=>g.borrowed>0);if(borrowed.length)f.push(['teal','₹',`${borrowed.length} goal${borrowed.length>1?'s':''} (${borrowed.map(g=>g.name).join(', ')}) will be funded by borrowing — cheaper than selling early, but it means EMIs. Push the date or the price if you'd rather not.`]);
  if(R.proj.ruinAge)f.push(['red','⏳',`In the middle-of-the-road future your money runs out at ${R.proj.ruinAge}. Retiring later, spending less in retirement, or a smaller legacy each buy years.`]);
  if(!f.length)f.push(['teal','✓','No red flags. Rebalance to your target mix, keep the emergency fund topped up, and revisit yearly.']);
  return f.slice(0,4);}

/* ---------- OVERVIEW ---------- */
function tabOverview(){const R=RESULT,v=verdict(R);const s=R.mc.success;const col=v.good?'var(--teal)':v.frag?'var(--gold)':'var(--red)';const C=2*Math.PI*78;

    <div class="stat ${R.savings-R.emiTotal*12>0?'good':'bad'}"><div class="k">Left to invest</div><div class="v">${fmt(R.savings-R.emiTotal*12)}</div><div class="n">${pct((R.savings-R.emiTotal*12)/(R.annualInc||1),0)} savings rate</div></div>

      <div class="wi"><label>Surplus actually invested <b id="wi_disc_v">${S.disc}%</b></label><input type="range" id="wi_disc" min="30" max="100" step="5" value="${S.disc}"></div>

    <div style="margin-top:14px;display:flex;gap:10px;align-items:center"><button class="btn btn-primary btn-sm" id="wi_apply" disabled>Apply to my plan</button><span class="tip">Spending cuts apply proportionally to every category except insurance premiums.</span></div></div>
  <div class="card"><h3>Where your money should sit <span class="pill">${esc(S.risk)}</span></h3>${help('Your risk read sets a target split between equity (growth, swings), debt (steady, lower) and cash (safety, liquidity). The bar shows where you are today versus where the plan wants you.')}
    <div class="two"><div><h5>Today · ${R.allocTotal>1?fmt(R.allocTotal):'nothing invested yet'}</h5>${R.allocTotal>1?allocBar(R.curEq/R.allocTotal,R.curDebt/R.allocTotal,R.curCash/R.allocTotal):'<div class="empty" style="margin:8px 0 6px">Your first SIPs should follow the target →</div>'}</div><div><h5>Target</h5>${allocBar(t.eq,t.debt,t.cash)}</div></div>

function allocBar(e,d,c){const f=x=>Math.max(0,x*100);return `<div class="bar"><span class="eq" style="width:${f(e)}%">${f(e)>=8?f(e).toFixed(0)+'%':''}</span><span class="db" style="width:${f(d)}%">${f(d)>=8?f(d).toFixed(0)+'%':''}</span><span class="ca" style="width:${f(c)}%">${f(c)>=8?f(c).toFixed(0)+'%':''}</span></div>`;}
function scriptWhatIf(){setTimeout(()=>{const r=$('#wi_ret'),d=$('#wi_disc'),c=$('#wi_cut');if(!r)return;let pend;
  const run=()=>{$('#wi_ret_v').textContent=r.value;$('#wi_disc_v').textContent=d.value+'%';$('#wi_cut_v').textContent=c.value+'%';[r,d,c].forEach(e=>e.style.setProperty('--p',((e.value-e.min)/(e.max-e.min)*100)+'%'));
    clearTimeout(pend);pend=setTimeout(()=>{const S2=JSON.parse(JSON.stringify(S));S2.ret=+r.value;if(S2.life<=S2.ret)S2.life=S2.ret+5;S2.disc=+d.value;const cut=+c.value/100;S2.EXP.forEach(e=>{if(e.name.indexOf('Insurance')!==0)e.amt=Math.round(e.amt*(1-cut));});
      const R=RESULT;const same=(+r.value===S.ret&&+d.value===S.disc&&+c.value===0);const R2=same?R:ENGINE.calc(S2,{runs:250});const s2=R2.mc.success;const dlt=s2-R.mc.success;
      $('#wi_out1').innerHTML=`<div class="k">Odds with these changes</div><div class="v" style="color:${s2>=.75?'var(--teal)':s2>=.4?'var(--gold-ink)':'var(--red)'}">${oddsPct(s2)}%</div><div class="n">${dlt>=0?'+':''}${oddsPct(s2)-oddsPct(R.mc.success)} points vs now</div>`;
      $('#wi_out2').innerHTML=`<div class="k">Corpus at retirement (median)</div><div class="v">${fmt(R2.mc.p50)}</div><div class="n">vs ${fmt(R.mc.p50)} now</div>`;

  [r,d,c].forEach(e=>e.addEventListener('input',run));run();
  $('#wi_apply').onclick=()=>{S.ret=+r.value;if(S.life<=S.ret)S.life=S.ret+5;S.disc=+d.value;const cut=+c.value/100;S.EXP.forEach(e=>{if(e.name.indexOf('Insurance')!==0)e.amt=Math.round(e.amt*(1-cut));});save();compute(500);renderPlanTab();toast('Applied. Plan rebuilt.');};},0);return '';}

function tabNetworth(){const R=RESULT;const L=(l,v,cls)=>`<div class="line"><span class="l">${l}</span><span class="v ${cls||''}">${fmt(v)}</span></div>`;
  return `<div class="card editable">${editBtn('nw_edit')}<h3>Net-worth statement</h3>${help('Everything you own, minus everything you owe. Cash sits in "assets" because it is one — but six months of spending gets ring-fenced as your emergency fund before anything is invested.')}

    <div><h5>Liabilities</h5>${L('Loans outstanding',R.loans,'bad')}${R.emiTotal?`<div class="line"><span class="l">EMIs per month</span><span class="v">${inr(R.emiTotal)}</span></div>`:''}<h5 style="margin-top:26px">Investable today</h5>${L('Equity',R.eqVal)}${L('Debt',R.debtInvVal)}${L('Cash',R.cash)}</div></div>
    <div class="line total"><span class="l">Net worth</span><span class="v ${R.netWorth>=0?'good':'bad'}">${fmt(R.netWorth)}</span></div>
    <div class="callout">${R.netWorth<=0?'<b>Starting from zero is not a verdict, it\'s a starting line.</b> The plan cares far more about your savings rate than your opening balance.':R.house/(R.netWorth||1)>0.6?'<b>Most of your net worth is your home.</b> That\'s common in India — but a home doesn\'t pay for groceries at 75. Watch the investable number.':'<b>Investable net worth</b> is what actually funds goals and retirement. Property and gold count, but they\'re slow and lumpy to sell.'}</div>
    <div class="opt-body" id="nw_edit" style="margin-top:20px"><h5>Cash & PF</h5><div class="grid3">${numField({path:'cash',label:'Cash & savings',pre:'₹'})}${numField({path:'pf',label:'Provident fund',pre:'₹'})}<div></div></div>
      <h5>Mutual funds & stocks</h5>${tableMF()}<h5>Fixed income</h5>${tableFI()}<h5>Property, land, gold, vehicles</h5>${tableAssets()}<h5>Loans</h5>${tableLoans()}</div></div>
  <div class="card"><h3>How it grows</h3>${help('Investable wealth in the middle-of-the-road future (no random shocks), by age. Home value shown separately — it appreciates, but you live in it.')}
    ${chartNW(R)}</div>`;}
function chartNW(R){const P=R.proj.proj;const W=900,H=300,ml=86,mr=20,mt=16,mb=34;const xs=P.length;const maxV=Math.max(1,...P.map(r=>r.netWorth));
  const X=i=>ml+i/(xs-1)*(W-ml-mr),Y=v=>mt+(H-mt-mb)*(1-Math.max(0,v)/maxV);
  const line=(k)=>P.map((r,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(r[k]).toFixed(1)).join(' ');
  const ticks=[0,.25,.5,.75,1].map(f=>`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${Y(maxV*f)}" y2="${Y(maxV*f)}"/><text x="${ml-8}" y="${Y(maxV*f)+4}" text-anchor="end">${fmt(maxV*f).replace('₹','')}</text>`).join('');
  const ages=P.filter((r,i)=>i%5===0).map((r,i)=>`<text x="${X(P.indexOf(r))}" y="${H-10}" text-anchor="middle">${r.age}</text>`).join('');
  const ri=S.ret-S.age;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${ticks}${ages}
    ${ri>0&&ri<xs?`<line class="retline" x1="${X(ri)}" x2="${X(ri)}" y1="${mt}" y2="${H-mb}"/><text class="lbl" x="${X(ri)+6}" y="${mt+12}">retire ${S.ret}</text>`:''}
    <path d="${line('netWorth')}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/><path class="p50" d="${line('total')}"/>
    <text class="lbl" x="${X(xs-1)-4}" y="${Y(P[xs-1].total)-8}" text-anchor="end" style="fill:var(--teal)">investable</text>
    ${P[xs-1].houseVal?`<text class="lbl" x="${X(xs-1)-4}" y="${Y(P[xs-1].netWorth)-8}" text-anchor="end" style="fill:var(--gold)">incl. home</text>`:''}</svg>`;}

    <div class="callout">${(()=>{const b=ev.filter(g=>g.borrowed>0),s=ev.filter(g=>g.action.indexOf('Sold')===0);return b.length?`<b>${b.length} goal${b.length>1?'s':''} involve${b.length>1?'':'s'} a loan.</b> ${b.some(g=>g.action==='Borrow')?'Where the whole goal is borrowed, borrowing beat selling: your investments were expected to grow faster than the loan costs. ':''}${b.some(g=>g.action==='Sell + borrow')?'Where it says "sell + borrow", your holdings were sold first and a loan covered the rest. ':''}Either way, EMIs land on top of expenses in the years after. If you'd rather not, move a date out or a price down and watch the route change.`:s.length?`<b>Goals funded by selling holdings.</b> Cheaper than a loan here — note the tax line, it's real money.`:`<b>Every goal is paid from that year's surplus.</b> Nothing is sold, nothing is borrowed. Good.`;})()}</div></div>`;}

/* ---------- RETIREMENT ---------- */
function tabRetirement(){const R=RESULT,mc=R.mc,pj=R.proj;const good=mc.success>=0.75,frag=mc.success>=0.4&&!good;const col=good?'good':frag?'warn':'bad';
  const rows=pj.proj.filter((r,i)=>i%5===0||r.age===S.ret||r.goals.length||r.age===S.life);
  return `<div class="card editable">${editBtn('rt_edit')}<h3>Retirement — will you have enough?</h3>${help(`Not one number: a probability and a range. Every year of every simulated life draws its own market return, so crashes land in different places each time — including, sometimes, right before you retire.`)}
    <div class="stats"><div class="stat ${col}"><div class="k">Chance it works</div><div class="v">${oddsPct(mc.success)}%</div><div class="n">${mc.n} lifetimes · money lasts to ${S.life}${S.legacy?' + legacy':''}${mc.success>=0.995?'<br><b>We never show 100%.</b> All of these futures worked &mdash; but disability, divorce, fraud and tax changes are not modelled, so this is as close to certain as we can honestly say.':''}</div></div>
    <div class="stat"><div class="k">Corpus you need at ${S.ret}</div><div class="v">${fmt(pj.required)}</div><div class="n">to fund ${fmt(pj.expAtRet/12)}/mo of spending, inflating, to ${S.life}</div></div>
    <div class="stat"><div class="k">Corpus at ${S.ret}, central</div><div class="v">${fmt(mc.p50)}</div><div class="n">median of ${mc.n} real-market runs · a smooth, shock-free path would show a rosier ${fmt(pj.netWorthAtRet)}</div></div></div>
    ${pj.insolventYears>0?`<div class="callout red" style="margin-top:14px"><b>But you borrow to get there.</b> In ${pj.insolventYears} working year${pj.insolventYears>1?'s':''} your spending has to be bridged by a loan. A plan can "succeed" and still be chronically short while you're earning — that's worth fixing now, not at ${S.ret}.</div>`:''}
    ${pj.homeSoldAge?`<div class="callout gold" style="margin-top:14px"><b>The home gets sold at ${pj.homeSoldAge}.</b> The plan runs out of investments before it runs out of life, so it downsizes rather than declaring failure — which is what real families do.</div>`:''}
    <h5 style="margin-top:22px">What if you live longer than you planned?</h5>
    <p class="tag" style="margin-bottom:10px">Living long is a financial risk, not a bonus. The same plan, run to three different ages:</p>
    <div class="stats">${(RESULT.longevity||[]).map(l=>`<div class="stat ${l.success==null?'':(l.success>=75?'good':l.success>=40?'warn':'bad')}">
      <div class="k">If you live to ${l.age}</div><div class="v" style="font-size:24px">${l.success==null?'—':l.success+'%'}</div></div>`).join('')}</div>
    <h5 style="margin-top:22px">Range of outcomes — investable corpus at ${S.ret}</h5>

    ${pj.ruinAge?`<div class="callout red" style="margin-top:14px"><b>⚠ In the expected case, your money runs out at ${pj.ruinAge}.</b> ${S.life-pj.ruinAge} years short. The levers that matter most, in order: retire later, spend less in retirement, invest a bigger share of surplus, lower the legacy.</div>`:''}
    <div class="opt-body" id="rt_edit" style="margin-top:20px"><div class="grid3">${numField({path:'ret',label:'Retire at',int:1,min:S.age+1,max:90})}${numField({path:'life',label:'Money lasts until',int:1,min:S.age+2,max:105})}${numField({path:'disc',label:'Surplus invested',int:1,min:0,max:100,suf:'%'})}</div></div></div>
  <div class="card"><h3>The shape of your life, in money</h3>${help('Teal band: where 80% of your simulated futures fall (poor to great). Teal line: the middle. Gold dots: goals. Dashed red: what a year of living costs, rising with inflation. Where the band drops to the floor after retirement, that\'s money running out.')}
    ${chartLife(R)}</div>
  <div class="card editable">${editBtn('lg_edit')}<h3>What you leave behind</h3>
    ${S.legacy>0?`<div class="stats"><div class="stat"><div class="k">You want to leave (today's ₹)</div><div class="v" style="font-size:24px">${fmt(S.legacy)}</div><div class="n">worth ${fmt(pj.legacyTarget)} by ${S.life}</div></div><div class="stat"><div class="k">Estate ends at, expected</div><div class="v" style="font-size:24px">${fmt(pj.endWorth)}</div><div class="n">${S.legacyHouse?'incl. the home':'cash & investments'}</div></div><div class="stat ${pj.legacyMet?'good':'bad'}"><div class="k">${pj.legacyMet?'Legacy protected':'Short by'}</div><div class="v" style="font-size:24px">${pj.legacyMet?'✓':fmt(pj.legacyTarget-pj.endWorth)}</div><div class="n">survives in ${Math.round(mc.legacyRate*100)}% of lifetimes</div></div></div>`:
    `<p class="lead">You haven't set a legacy, so the plan assumes you spend down to nothing by ${S.life}. If you want to leave something for family, set it here — it changes how much you need.</p>`}
    <div class="opt-body ${S.legacy>0?'':'open'}" id="lg_edit" style="margin-top:16px"><div class="grid2">${numField({path:'legacy',label:'Leave behind (today\'s ₹)',pre:'₹'})}${selectField({path:'legacyHouse',label:'Count the home?',opts:[[1,'Yes — the home passes on'],[0,'No — cash & investments only']]})}</div></div></div>
  <div class="card"><h3>Year by year <span class="pill">every 5 yrs + goal years · ★ retirement</span></h3>
    <div style="overflow-x:auto"><table class="gtbl"><thead><tr><th>Age</th><th>Income</th><th>Tax</th><th>Spending</th><th>Invested</th><th>Portfolio</th><th>Net worth</th><th>Events</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.age}${r.age===S.ret?' <span class="star">★</span>':''}</td><td>${r.working?fmt(r.gross):'—'}</td><td>${r.tax?fmt(r.tax):'—'}</td><td>${fmt(r.exp+r.emi)}</td><td>${r.invested>0?fmt(r.invested):'—'}</td><td><b>${fmt(r.total)}</b></td><td>${fmt(r.netWorth)}</td><td class="t" style="font-size:12px;color:var(--muted)">${r.goals.map(g=>g.name+' — '+g.action.toLowerCase()).join('; ')}</td></tr>`).join('')}
    </tbody></table></div><p class="tag" style="margin-top:10px">Withdrawals in retirement and goal liquidations are taxed; rent stops when you buy the home; PF joins the corpus at ${S.ret}; equity is glided down in the 15 years before retirement and the portfolio is rebalanced yearly. Lifetime tax paid in this plan: <b>${fmt(pj.lifetimeTax)}</b>.</p></div>`;}
function chartLife(R){const B=R.mc.band,P=R.proj.proj;const W=900,H=340,ml=86,mr=20,mt=18,mb=34;const n=B.length;
  const maxV=Math.max(1,...B.map(b=>b.p90),...P.map(r=>r.exp))*1.04;const X=i=>ml+i/(n-1)*(W-ml-mr),Y=v=>mt+(H-mt-mb)*(1-Math.min(1,Math.max(0,v)/maxV));
  const up=B.map((b,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(b.p90).toFixed(1)).join(' ');const lo=B.map((b,i)=>'L'+X(n-1-i).toFixed(1)+','+Y(B[n-1-i].p10).toFixed(1)).join(' ');
  const med=B.map((b,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(b.p50).toFixed(1)).join(' ');const exp=P.map((r,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(r.exp+r.emi).toFixed(1)).join(' ');
  const ticks=[0,.25,.5,.75,1].map(f=>`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${Y(maxV*f)}" y2="${Y(maxV*f)}"/><text x="${ml-8}" y="${Y(maxV*f)+4}" text-anchor="end">${fmt(maxV*f).replace('₹','')}</text>`).join('');
  const ages=P.filter((r,i)=>i%5===0).map(r=>`<text x="${X(P.indexOf(r))}" y="${H-10}" text-anchor="middle">${r.age}</text>`).join('');
  const goals=P.flatMap((r,i)=>r.goals.map(g=>`<circle class="goal" cx="${X(i)}" cy="${Y(B[i].p50)}" r="5"><title>${esc(g.name)} · ${fmt(g.amt)} · ${g.action}</title></circle>`)).join('');
  const ri=S.ret-S.age;const reqY=Y(R.proj.required);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${ticks}${ages}
    <path class="band" d="${up} ${lo} Z"/><path class="exp" d="${exp}"/><path class="p50" d="${med}"/>${goals}
    ${ri>0&&ri<n?`<line class="retline" x1="${X(ri)}" x2="${X(ri)}" y1="${mt}" y2="${H-mb}"/><text class="lbl" x="${X(ri)+6}" y="${mt+12}">retire ${S.ret}</text>`:''}
    ${R.proj.required<maxV?`<line class="req" x1="${ml}" x2="${W-mr}" y1="${reqY}" y2="${reqY}"/><text class="lbl" x="${W-mr-4}" y="${reqY-5}" text-anchor="end" style="opacity:.7">corpus needed at ${S.ret}</text>`:''}
    <text class="lbl" x="${X(Math.min(n-1,ri+3))}" y="${Y(P[Math.min(n-1,ri+3)].exp)-6}" style="fill:var(--red)">yearly spending</text></svg>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--teal);opacity:.3"></i>80% of futures</span><span><i style="background:var(--teal)"></i>Median</span><span><i style="background:var(--red)"></i>Yearly spending</span><span><i style="background:var(--gold)"></i>Goal</span></div>`;}

    <p class="tag" style="margin-top:14px">Premiums shown are rough estimates (₹7,000 per crore of term cover per year). Get real quotes. Health and critical-illness needs are model rules of thumb, not medical advice.</p></div>`;}

    <h5>To get there</h5>${line('Equity',R.curEq,R.revEq)}${line('Debt',R.curDebt,R.revDebt)}${line('Cash',R.curCash,R.revCash)}

  <div class="card"><h3>How to fill each sleeve <span class="pill">illustrative examples</span></h3>${help(`Your ${S.risk} profile sets the category mix — that's planning, and it's ours to give. The specific scheme names are illustrative examples of each category, to be replaced by your bank's approved list or a SEBI-registered adviser's picks. Naming a scheme to buy is investment advice under SEBI's IA Regulations, which we don't give. Amounts are what your target sleeves come to today; new SIPs go in the same proportions.`)}

/* ---------- LIFE HAPPENING ---------- */
function tabLife(){const R=RESULT,mc=R.mc,A=R.A;
  return `<div class="card editable">${editBtn('lf_edit')}<h3>Life happening to you <span class="pill">modelled, not ignored</span></h3>${help(`Across ${mc.n} simulated lifetimes, this is what went wrong on average — because in real life, it does. None of it is a prediction about you; all of it is why the plan reports a probability instead of one confident number.`)}
    <div class="shock"><div class="stat"><div class="k">Job losses per lifetime</div><div class="v" style="font-size:26px">${mc.avgJobLoss.toFixed(1)}</div><div class="n">${ENGINE.BEHAVIOUR.jobLossMonthsMid}–${ENGINE.BEHAVIOUR.jobLossMonthsSenior} months' income lost (longer if senior), then a ${pct(ENGINE.BEHAVIOUR.jobLossPayCut,0)} pay cut that recovers slowly</div></div>
    <div class="stat"><div class="k">Major medical events</div><div class="v" style="font-size:26px">${mc.avgMed.toFixed(1)}</div><div class="n">avg ${fmt(mc.avgOop)} out of pocket over a lifetime, after your cover</div></div>
    <div class="stat"><div class="k">Years you stop investing</div><div class="v" style="font-size:26px">${mc.avgPaused.toFixed(1)}</div><div class="n">SIPs get paused in real life</div></div></div>
    ${mc.medianRuin?`<div class="line" style="margin-top:14px"><span class="l" style="color:var(--red)">In the lifetimes that fail, money typically runs out at</span><span class="v" style="color:var(--red)">${mc.medianRuin}</span></div>`:''}
    <div class="line"><span class="l">Of your surplus, actually invested</span><span class="v">${S.disc}%</span></div>
    <div class="opt-body" id="lf_edit" style="margin-top:16px"><div class="grid3">${numField({path:'disc',label:'Surplus invested',int:1,min:0,max:100,suf:'%'})}${numField({path:'healthcover',label:'Health cover',pre:'₹'})}<div></div></div></div>
    <div class="callout" style="margin-top:16px"><b>Grounded in Indian data, not guesses.</b> Discipline: AMFI's SIP stoppage ratio hit 122–127% in early 2025 (baseline 41–51% in 2021–22, partly a dormant-folio cleanup — read it as "attrition is continuous"); 43% of affluent Indians save under 20% of income (Marcellus 2025). Medical: NSSO data shows 41.4% of Indian households spend over 10% of consumption on a single hospitalisation; catastrophic spending is ~4× likelier in private hospitals. Job loss: ~100,000 Indian tech layoffs in 2025, and laid-off professionals commonly re-enter at lower pay; time out of work is age-aware (Indian searches run 6–14 weeks mid-level, 12–24 weeks senior), with a long-tail case because PLFS shows long-term unemployment rising. <b>Where we are weakest, flagged honestly:</b> our forward equity assumption sits below what 1997–2025 actually delivered, so against that history this plan reads as pessimistic — which is deliberate, but it means the model would have been too gloomy in India's fastest-growing era.</div></div>
  <div class="card"><h3>What a shock actually does to a plan</h3>${help('Three mechanics you can see in the year-by-year table:')}

/* ---------- ASSUMPTIONS ---------- */
function tabAssumptions(){const R=RESULT,A=R.A,T=A.tax;const af=(k,label,o)=>numField(Object.assign({path:'assume.'+k,label},o));
  /* seed S.assume with defaults so fields show values */
  ['infl','cash','epf','postRet','houseGrowth','houseUpkeep','mcRuns'].forEach(k=>{if(S.assume[k]==null)S.assume[k]=ENGINE.RET_ASSUME[k];});
  ['sipPauseProb','jobLossProb','jobLossMonthsMid','jobLossMonthsSenior','jobLossPayCut','medMinCost','medMaxCost'].forEach(k=>{if(S.assume[k]==null)S.assume[k]=ENGINE.BEHAVIOUR[k];});
  return `<div class="card"><h3>What we're assuming <span class="pill">no black boxes</span></h3><p class="lead">Every number in this plan comes from these. Change any of them and the plan recomputes. Returns are forward-looking estimates, not past performance, and not guarantees.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="S.assume={};save();compute(500);renderPlanTab();toast('Assumptions reset')">Reset to defaults</button></div>
    <h5>Economy</h5><div class="assume-grid">${af('infl','General inflation / yr',{pct:1,suf:'%',help:'Applies to bonuses, goals without their own rate, retirement spending'})}${af('cash','Cash & emergency-fund return',{pct:1,suf:'%'})}${af('epf','Provident-fund rate',{pct:1,suf:'%'})}${af('debtRet','Debt-fund expected return',{pct:1,suf:'%'})}${af('debtVol','Debt-fund volatility',{pct:1,suf:'±%'})}${af('eqShift','Shift every equity return by',{pct:1,suf:'± pts',help:'Negative to stress-test. Sleeve is now '+pct(R.sleeve.ret,1)})}</div>
    <h5>Home & retirement</h5><div class="assume-grid">${af('houseGrowth','Home appreciation / yr',{pct:1,suf:'%'})}${af('houseUpkeep','Home upkeep + property tax (% of value / yr)',{pct:1,suf:'%'})}${af('postRet','Retirement lifestyle vs today',{pct:1,suf:'%',help:'90% = commute and work costs fall away; medical rises 1.25× on top'})}${af('mcRuns','Simulated lifetimes per build',{int:1,min:100,max:2000,help:'More = smoother odds, slower'})}</div>
    <h5>Real Indian behaviour & shocks</h5><div class="assume-grid">${af('sipPauseProb','Chance of pausing SIPs in any year',{pct:1,suf:'%'})}${af('jobLossProb','Chance of job loss per working year',{pct:1,suf:'%'})}${af('jobLossMonthsMid','Months out of work — mid-career',{int:1,min:0,max:24})}${af('jobLossMonthsSenior','Months out of work — senior (40+)',{int:1,min:0,max:24})}${af('jobLossPayCut','Pay cut after job loss (recovers over time)',{pct:1,suf:'%'})}${af('medMinCost','Hospitalisation cost — floor (today)',{pre:'₹'})}${af('medMaxCost','Hospitalisation cost — ceiling (today)',{pre:'₹'})}</div></div>
  <div class="card"><h3>Tax rules applied <span class="pill gold">${T.asOf}</span></h3><p class="lead">Tax lives in one dated block. When the Budget changes, that block is updated and every plan recalculates.</p>
    <div class="two" style="margin-top:12px"><div><h5>Income tax on salary & bonus</h5>${T.slabs.map((s,i)=>`<div class="line"><span class="l">${i===0?'Up to':'Next, to'} ${s[0]===Infinity?'above':fmt(s[0])}</span><span class="v">${pct(s[1],0)}</span></div>`).join('')}<div class="line"><span class="l">Standard deduction</span><span class="v">${fmt(T.stdDeduction)}</span></div><div class="line"><span class="l">Rebate — no tax if taxable ≤</span><span class="v">${fmt(T.rebateBelowTaxable)}</span></div><div class="line"><span class="l">Cess</span><span class="v">${pct(T.cess,0)}</span></div></div>
    <div><h5>Capital gains on withdrawals</h5><div class="line"><span class="l">Equity LTCG</span><span class="v">${pct(T.ltcgEquity,1)} on gains</span></div><div class="line"><span class="l">Debt</span><span class="v">at slab (${pct(T.debtSlabRate,0)})</span></div><div class="line"><span class="l">Assumed embedded gain when selling equity / debt</span><span class="v">${pct(T.gainFracEq,0)} / ${pct(T.gainFracDebt,0)}</span></div><div class="line"><span class="l">Lifetime tax paid in this plan</span><span class="v">${fmt(R.proj.lifetimeTax)}</span></div><div class="line"><span class="l">Emergency fund (6 months, funded first)</span><span class="v">${fmt(R.proj.proj[0].ef)}</span></div><div class="line"><span class="l">Withdrawal order</span><span class="v" style="font-size:12.5px">cash → emergency fund → debt → equity</span></div></div></div></div>
  <div class="card"><h3>Goal inflation, by type</h3><p class="lead">Each goal type has its own rate. Housing runs hottest; travel slowest.</p>
    <table class="gtbl" style="margin-top:12px"><thead><tr><th>Goal type</th><th>Inflation / yr</th><th>If short, funded by</th><th>Loan rate · tenure</th></tr></thead><tbody>${GOAL_TYPES.map(g=>{const l=ENGINE.LOAN_CFG[ENGINE.GOAL2LOAN[g]];return `<tr><td class="t">${g}</td><td>${pct(ENGINE.GOAL_INFL[g],2)}</td><td class="t">${ENGINE.GOAL2LOAN[g]} loan</td><td>${pct(l.r,1)} · ${l.t} yrs</td></tr>`;}).join('')}</tbody></table>
    <p class="tag" style="margin-top:12px">Rent follows a 5% / 5% / 10% three-year cycle. Per-category expense inflation is editable in "Money out" on the inputs page.</p></div>`;}
